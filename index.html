<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>my reading log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --ink: #111; --muted: #777; --faint: #999; --bg: #faf9f7;
      --accent: #b5490b; --mono: 'Source Code Pro', monospace;
    }
    html { font-size: 13px; }
    body { background: var(--bg); color: var(--ink); font-family: var(--mono); min-height: 100vh; padding: 0 20px; }
    .container { max-width: 680px; margin: 0 auto; padding: 64px 0 100px; }
    header { margin-bottom: 48px; }
    h1 { font-size: 1rem; font-weight: 400; color: var(--ink); margin-bottom: 6px; }
    .header-meta { font-size: 1rem; font-weight: 300; color: var(--muted); }
    .filter-bar { display: flex; gap: 16px; margin-bottom: 48px; flex-wrap: wrap; row-gap: 10px; }
    .filter-btn { font-family: var(--mono); font-size: 1rem; font-weight: 300; color: var(--muted); background: none; border: none; cursor: pointer; padding: 0; transition: color 0.15s; white-space: nowrap; }
    .filter-btn:hover, .filter-btn.active { color: var(--ink); }
    .filter-btn.active { text-decoration: underline; text-underline-offset: 3px; }
    .section-year { font-size: 1rem; font-weight: 300; color: var(--faint); margin-bottom: 16px; margin-top: 48px; }
    .section-year:first-of-type { margin-top: 0; }
    .book-list { list-style: none; }
    .book-item { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 20px; row-gap: 4px; padding: 11px 0; }
    .book-title-author { grid-column: 1; grid-row: 1; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
    .book-title { font-size: 1rem; font-weight: 500; color: #000; }
    .book-author { font-size: 1rem; font-weight: 300; color: var(--muted); }
    .book-note { grid-column: 1; grid-row: 2; font-size: 1rem; font-weight: 300; color: var(--muted); line-height: 1.5; }
    .book-rating { grid-column: 2; grid-row: 1 / 3; align-self: center; font-size: 1.1rem; font-weight: 400; color: var(--accent); white-space: nowrap; letter-spacing: 0.05em; }
    .tag { font-size: 1rem; font-weight: 300; color: var(--faint); }
    footer { margin-top: 72px; font-size: 1rem; font-weight: 300; color: var(--muted); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }
    footer a { color: inherit; text-decoration: none; }
    footer a:hover { color: var(--ink); }
    @media (max-width: 480px) {
      html { font-size: 12px; }
      body { padding: 0 16px; }
      .container { padding: 48px 0 80px; }
      .filter-bar { gap: 12px; row-gap: 8px; }
      .book-item { column-gap: 14px; }
    }
  </style>
</head>
<body>
  <div class="container">

    <header>
      <h1>my reading log</h1>
      <p class="header-meta">books i've read &middot; rated &amp; noted</p>
    </header>

    <div class="filter-bar" role="group" aria-label="Filter by genre">
      <button class="filter-btn active" data-filter="recent">recent</button>
      <button class="filter-btn" data-filter="economics">economics</button>
      <button class="filter-btn" data-filter="culture">culture</button>
      <button class="filter-btn" data-filter="politics">politics</button>
      <button class="filter-btn" data-filter="science">science</button>
      <button class="filter-btn" data-filter="philosophy">philosophy</button>
      <button class="filter-btn" data-filter="fiction">fiction</button>
      <button class="filter-btn" data-filter="psychology">psych/anthro</button>
      <button class="filter-btn" data-filter="sport">sport</button>
    </div>

    <div id="book-container"></div>

    <footer>
      <span>emily mcvl</span>
      <a href="https://emilymcvl.com">emilymcvl.com</a>
    </footer>

  </div>

  <script>
    /* ── CSV parser (handles quoted fields with commas) ── */
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = parseCSVLine(lines[0]);
      return lines.slice(1).map(line => {
        const vals = parseCSVLine(line);
        const obj = {};
        headers.forEach((h, i) => obj[h] = vals[i] || '');
        return obj;
      });
    }

    function parseCSVLine(line) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (inQuotes) {
          if (ch === '"' && line[i + 1] === '"') {
            current += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            current += ch;
          }
        } else {
          if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            result.push(current);
            current = '';
          } else {
            current += ch;
          }
        }
      }
      result.push(current);
      return result;
    }

    /* ── escape HTML entities ── */
    function esc(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    /* ── category display names and order ── */
    const categoryOrder = [
      'economics', 'culture', 'politics', 'science',
      'philosophy', 'fiction', 'psychology', 'sport'
    ];
    const categoryLabels = { psychology: 'psych/anthro' };

    /* ── render a single book as <li> ── */
    function renderBook(book, showTag) {
      const tagHtml = showTag
        ? `<span class="tag">[${esc(categoryLabels[book.category] || book.category)}]</span>`
        : '';
      return `<li class="book-item">
        <div class="book-title-author">
          <span class="book-title">${esc(book.title)}</span>
          <span class="book-author">${esc(book.author)}</span>
          ${tagHtml}
        </div>
        <div class="book-note">${esc(book.note)}</div>
        <div class="book-rating">${esc(book.rating)}</div>
      </li>`;
    }

    /* ── main render ── */
    function render(books, filter) {
      const container = document.getElementById('book-container');

      if (filter === 'recent') {
        // Flat list: only books with an "added" value, sorted A-Z, with [tag] shown
        const recent = books
          .filter(b => b.added)
          .sort((a, b) => a.title.localeCompare(b.title));
        container.innerHTML =
          `<p class="section-year">// recently added</p>
           <ul class="book-list">${recent.map(b => renderBook(b, true)).join('')}</ul>`;
        return;
      }

      // Category view: show only matching books, sorted A-Z
      const catBooks = books
        .filter(b => b.category === filter)
        .sort((a, b) => a.title.localeCompare(b.title));
      const label = categoryLabels[filter] || filter;
      container.innerHTML =
        `<p class="section-year">// ${esc(label)}</p>
         <ul class="book-list">${catBooks.map(b => renderBook(b, false)).join('')}</ul>`;
    }

    /* ── boot ── */
    fetch('books.csv')
      .then(r => r.text())
      .then(text => {
        const books = parseCSV(text);

        const btns = document.querySelectorAll('.filter-btn');
        btns.forEach(btn => {
          btn.addEventListener('click', () => {
            btns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            render(books, btn.dataset.filter);
          });
        });

        // default view
        render(books, 'recent');
      });
  </script>
</body>
</html>
